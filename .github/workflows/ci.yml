name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check version sync
        run: node scripts/check-version-sync.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm test
      - name: Check generated Swift spec model
        run: node swift/JSONRender/Scripts/generate-spec-model.mjs --check
      - name: Check React conformance fixtures
        run: node swift/JSONRender/Tools/conformance/render-fixtures.mjs --check

  swift:
    name: Swift (Linux, core)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # The SwiftUI, catalog, and example sources are behind
      # `#if canImport(SwiftUI)`, so on Linux this target builds and tests
      # JSONRenderCore only. The macOS job below compiles the rest.
      - name: Build
        working-directory: swift/JSONRender
        run: swift build
      - name: Test
        working-directory: swift/JSONRender
        run: swift test

  swift-macos:
    name: Swift (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: swift/JSONRender
        run: swift build
      - name: Test
        working-directory: swift/JSONRender
        run: swift test

  docs:
    name: Docs (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [production, preview]
    env:
      VERCEL_ENV: ${{ matrix.environment }}
      DOCS_EXPECT_NOINDEX: ${{ matrix.environment == 'preview' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='web^...'
      - run: pnpm --filter web build
      - run: pnpm --filter web test:routes

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
